name: Fork · Package macOS x64

on:
  workflow_call:
    inputs:
      ref:
        description: '需要打包的 Git ref'
        required: false
        type: string
        default: custom
  workflow_dispatch:
    inputs:
      ref:
        description: '需要打包的 Git ref'
        required: false
        type: string
        default: custom

permissions:
  contents: write

concurrency:
  group: fork-package-macos
  cancel-in-progress: false

jobs:
  package:
    name: Package unsigned x64 DMG
    runs-on: macos-15-intel
    timeout-minutes: 240
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned macOS x64 package
        env:
          DSH_TELEMETRY_DISABLED: '1'
        run: pnpm run package:desktop:mac:x64:unsigned

      - name: Upload DMG
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dsh-macos-x64-unsigned-${{ github.run_number }}
          path: apps/desktop/.desktop-build/targets/mac-x64/unsigned-artifacts/*.dmg
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish rolling fork release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="$(node -p "require('./package.json').version")"
          artifact="$(ls apps/desktop/.desktop-build/targets/mac-x64/unsigned-artifacts/*.dmg)"
          staged="$RUNNER_TEMP/dsh-fork-latest-mac-x64-unsigned.dmg"
          cp "$artifact" "$staged"
          tag="fork-latest"
          title="Fork latest · ${version}"
          notes="Automated unsigned macOS x64 build from the custom branch (run ${GITHUB_RUN_NUMBER})."
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$staged" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --title "$title" --notes "$notes" --latest --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$staged" --title "$title" --notes "$notes" --latest --repo "$GITHUB_REPOSITORY"
          fi
