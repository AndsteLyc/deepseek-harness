name: Fork · Package macOS x64

on:
  push:
    branches: [custom]
  workflow_call:
    inputs:
      ref:
        description: '需要打包的 Git ref'
        required: false
        type: string
        default: custom
  workflow_dispatch:
    inputs:
      ref:
        description: '需要打包的 Git ref'
        required: false
        type: string
        default: custom

permissions:
  contents: write

concurrency:
  group: fork-package-macos
  cancel-in-progress: false

jobs:
  package:
    name: Package unsigned x64 DMG
    runs-on: macos-15-intel
    timeout-minutes: 240
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned macOS x64 package
        env:
          DSH_TELEMETRY_DISABLED: '1'
        run: pnpm run package:desktop:mac:x64:unsigned

      - name: Upload DMG
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dsh-macos-x64-unsigned-${{ github.run_number }}
          path: apps/desktop/.desktop-build/targets/mac-x64/unsigned-artifacts/*.dmg
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish rolling fork release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="$(node -p "require('./package.json').version")"
          artifact="$(ls apps/desktop/.desktop-build/targets/mac-x64/unsigned-artifacts/*.dmg)"
          staged="$RUNNER_TEMP/dsh-fork-latest-mac-x64-unsigned.dmg"
          manifest="$RUNNER_TEMP/fork-latest.json"
          cp "$artifact" "$staged"
          sha512="$(shasum -a 512 "$staged" | awk '{print $1}')"
          size="$(stat -f%z "$staged")"
          commit="$(git rev-parse HEAD)"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          MANIFEST_PATH="$manifest" ASSET_NAME="dsh-fork-latest-mac-x64-unsigned.dmg" VERSION="$version" SHA512="$sha512" SIZE="$size" COMMIT="$commit" BUILT_AT="$built_at" RUN_ID="$GITHUB_RUN_ID" node -e '
            const fs = require("node:fs");
            fs.writeFileSync(process.env.MANIFEST_PATH, JSON.stringify({
              version: process.env.VERSION,
              commit: process.env.COMMIT,
              sha512: process.env.SHA512,
              size: Number(process.env.SIZE),
              assetName: process.env.ASSET_NAME,
              builtAt: process.env.BUILT_AT,
              runId: process.env.RUN_ID,
            }, null, 2) + "\n");
          '
          versioned_tag="fork-v${version}-r${GITHUB_RUN_NUMBER}"
          versioned_title="Fork build · ${version} · run ${GITHUB_RUN_NUMBER}"
          versioned_notes="Immutable unsigned macOS x64 build from commit ${commit} at ${built_at}."
          if ! gh release view "$versioned_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$versioned_tag" "$staged" "$manifest" --title "$versioned_title" --notes "$versioned_notes" --latest=false --repo "$GITHUB_REPOSITORY"
          fi
          tag="fork-latest"
          title="Fork latest · ${version}"
          notes="Rolling unsigned macOS x64 build from the custom branch (run ${GITHUB_RUN_NUMBER}). Immutable build: ${versioned_tag}."
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$staged" "$manifest" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --title "$title" --notes "$notes" --latest --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$staged" "$manifest" --title "$title" --notes "$notes" --latest --repo "$GITHUB_REPOSITORY"
          fi
