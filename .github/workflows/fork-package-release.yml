name: Fork · Package official macOS x64

on:
  push:
    branches: [custom]
  workflow_call:
    inputs:
      ref:
        description: '需要打包的 Git ref'
        required: false
        type: string
        default: custom
  workflow_dispatch:
    inputs:
      ref:
        description: '需要打包的 Git ref'
        required: false
        type: string
        default: custom

permissions:
  contents: write
  actions: write

concurrency:
  group: fork-package-macos
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/custom'
    name: Package unsigned x64 DMG
    runs-on: macos-15-intel
    timeout-minutes: 240
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Stop legacy automatic development merges
        if: github.ref == 'refs/heads/custom'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/fork-sync-upstream.yml/disable"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/fork-package-macos.yml/disable"

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Fetch pinned official release tag
        run: |
          tag="$(node -p "require('./.github/fork-release.json').upstreamTag")"
          git fetch --no-tags https://github.com/deepseek-ai/deepseek-harness.git "refs/tags/$tag:refs/tags/$tag"

      - name: Verify official release baseline
        run: |
          node --input-type=module <<'JS'
          import { spawnSync } from 'node:child_process'
          for (const args of [
            ['--test', '.github/scripts/verify-release-base.test.mjs'],
            ['.github/scripts/verify-release-base.mjs'],
          ]) {
            const result = spawnSync(process.execPath, args, { encoding: 'utf8' })
            process.stdout.write(result.stdout ?? '')
            process.stderr.write(result.stderr ?? '')
            if (result.status !== 0) {
              const diagnostic = `${result.error?.message ?? ''}\n${result.stdout ?? ''}\n${result.stderr ?? ''}`.trim()
              const annotation = diagnostic.slice(-24000).replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A')
              console.log(`::error title=Official release baseline::${annotation}`)
              process.exit(result.status ?? 1)
            }
          }
          JS

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned macOS x64 package
        env:
          DSH_TELEMETRY_DISABLED: '1'
        run: pnpm run package:desktop:mac:x64:unsigned

      - name: Upload DMG
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dsh-macos-x64-unsigned-${{ github.run_number }}
          path: apps/desktop/.desktop-build/targets/mac-x64/unsigned-artifacts/*.dmg
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish rolling fork release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="$(node -p "require('./package.json').version")"
          artifact="$(ls apps/desktop/.desktop-build/targets/mac-x64/unsigned-artifacts/*.dmg)"
          staged="$RUNNER_TEMP/dsh-fork-latest-mac-x64-unsigned.dmg"
          manifest="$RUNNER_TEMP/fork-latest.json"
          cp "$artifact" "$staged"
          sha512="$(shasum -a 512 "$staged" | awk '{print $1}')"
          size="$(stat -f%z "$staged")"
          commit="$(git rev-parse HEAD)"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          MANIFEST_PATH="$manifest" ASSET_NAME="dsh-fork-latest-mac-x64-unsigned.dmg" VERSION="$version" SHA512="$sha512" SIZE="$size" COMMIT="$commit" BUILT_AT="$built_at" RUN_ID="$GITHUB_RUN_ID" node -e '
            const fs = require("node:fs");
            const baseline = JSON.parse(fs.readFileSync(".github/fork-release.json", "utf8"));
            fs.writeFileSync(process.env.MANIFEST_PATH, JSON.stringify({
              version: process.env.VERSION,
              upstreamTag: baseline.upstreamTag,
              upstreamCommit: require("node:child_process").execFileSync("git", ["rev-parse", `${baseline.upstreamTag}^{commit}`], { encoding: "utf8" }).trim(),
              upstreamTree: baseline.upstreamTree,
              commit: process.env.COMMIT,
              sha512: process.env.SHA512,
              size: Number(process.env.SIZE),
              assetName: process.env.ASSET_NAME,
              builtAt: process.env.BUILT_AT,
              runId: process.env.RUN_ID,
            }, null, 2) + "\n");
          '
          versioned_tag="fork-v${version}-r${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          versioned_title="Fork build · ${version} · run ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          versioned_notes="Immutable unsigned macOS x64 build from commit ${commit} at ${built_at}."
          if ! gh release view "$versioned_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$versioned_tag" "$staged" "$manifest" --title "$versioned_title" --notes "$versioned_notes" --latest=false --target "$commit" --repo "$GITHUB_REPOSITORY"
          fi
          tag="fork-latest"
          title="Fork latest · ${version}"
          notes="Rolling unsigned macOS x64 build from the custom branch (run ${GITHUB_RUN_NUMBER}). Immutable build: ${versioned_tag}."
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$staged" "$manifest" --clobber --repo "$GITHUB_REPOSITORY"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha="$commit"
            gh release edit "$tag" --title "$title" --notes "$notes" --latest --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$staged" "$manifest" --title "$title" --notes "$notes" --latest --target "$commit" --repo "$GITHUB_REPOSITORY"
          fi
